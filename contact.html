<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Chesem Chanel</title>
</head>
<body>

  <header>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Contact Me</h1>
    <p>Feel free to reach out! Fill in the form below and I'll get back to you.</p>

    <form action="#" method="POST">

      <label for="name">Full Name *</label><br />
      <input
        type="text"
        id="name"
        name="name"
        placeholder="Your full name"
        required
        minlength="2"
        maxlength="60"
      /><br /><br />

      <label for="email">Email Address *</label><br />
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
      /><br /><br />

      <label for="phone">Phone Number (optional)</label><br />
      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="+254 700 000 000"
        pattern="[+0-9\s]{7,15}"
      /><br /><br />

      <label for="subject">Subject *</label><br />
      <input
        type="text"
        id="subject"
        name="subject"
        placeholder="What is this about?"
        required
        minlength="3"
        maxlength="100"
      /><br /><br />

      <label for="message">Message *</label><br />
      <textarea
        id="message"
        name="message"
        rows="6"
        cols="40"
        placeholder="Write your message here..."
        required
        minlength="10"
      ></textarea><br /><br />

      <label for="reason">Reason for contact *</label><br />
      <select id="reason" name="reason" required>
        <option value="">-- Select a reason --</option>
        <option value="collaboration">Collaboration</option>
        <option value="feedback">Feedback</option>
        <option value="hiring">Hiring</option>
        <option value="other">Other</option>
      </select><br /><br />

      <input type="checkbox" id="agree" name="agree" required />
      <label for="agree">I agree to be contacted by Chesem Chanel *</label><br /><br />

      <button type="submit">Send Message</button>
      <button type="reset">Clear Form</button>

    </form>
  </main>

  <footer>
    <p>&copy; 2026 Chesem Chanel | Built with ❤️</p>
  </footer>

</body>
</html>
